    CreateCartItemRequestSchema:
      type: object
      properties:
        planId:
          type: string
          description: The ID of the plan to add to the cart. Each plan can only appear
            once per cart.
        cartId:
          type: string
          description: The ID of the cart to add this item to. The cart's status must
            be active.
        grantee:
          type: string
          description: The grantee to assign this cart item to. Pass any identifier
            like a user ID to assign to an individual grantee. If the value is not
            provided, the cart `owner` is used. To assign to a group, pass a group
            ID prefixed with `grp_`, useful for onboarding entire teams (only applicable
            to per-seat). The grantee will receive access to the plan's when the subscription
            is active.
        interval:
          enum:
          - day
          - week
          - month
          - year
          description: The billing interval for this cart item. One of `day`, `week`,
            `month`, `year`. If the cart already has an interval set, this value must
            match it.
          type:
          - string
          - 'null'
        intervalCount:
          type:
          - number
          - 'null'
          description: The number of intervals between billing cycles. If the cart
            already has an interval count set, this value must match it.
        metadata:
          "$ref": "#/components/schemas/CreateCartItemRequestSchemaMetadata2"
      required:
      - planId
      - cartId
      - interval
      - intervalCount
      additionalProperties: false
      title: CreateCartItemRequestSchema
    UpdateSubscriptionPlanLineItemSchema:
      type: object
      properties:
        quantity:
          type: number
          description: The new quantity for this subscription plan line item. Must
            be within the line item's minimum and maximum allowed quantities, and
            cannot be less than the number of current grantees on the attached group.
        proration:
          type: string
          enum:
          - always_invoice
          - create_prorations
          - none
          description: Controls how Stripe handles proration when the quantity changes
            mid-billing-period. One of `always_invoice`, `create_prorations`, `none`.
      required:
      - quantity
      additionalProperties: false
      title: UpdateSubscriptionPlanLineItemSchema
    ConsumeTokenRequestSchema:
