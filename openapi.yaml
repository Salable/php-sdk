      description: Resource ID
    IdempotencyKeyHeaderParam:
      in: header
      name: idempotency-key
      required: false
      schema:
        type: string
        maxLength: 255
      description: Optional idempotency key to prevent duplicate requests. Use unique
        strings like V4 UUIDs to avoid collisions. The key will be deleted after 24
        hours.
  headers:
    IdempotencyKeyHeader:
      description: The idempotency key used for the request — either the value supplied
        in the idempotency-key request header or a generated key. Reuse it to retry
        the request idempotently.
      schema:
        type: string
    IdempotentReplayedHeader:
      description: Set to 'true' when the response was replayed from a previously
        stored result for the same idempotency key. Absent when the request was executed
        for the first time.
      schema:
        type: string
