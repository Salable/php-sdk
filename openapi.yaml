      summary: List Subscriptions
      operationId: listSubscriptions
      description: Returns a list of your subscriptions. The subscriptions are returned
        sorted by creation date, with the most recently created subscriptions appearing
        first.
      parameters:
      - name: owner
        in: query
        required: false
        schema:
          type: string
        description: Returns only subscriptions belonging to this owner.
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Returns only the subscription with this exact ID.
      - name: products
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Accepts a comma-separated list of product IDs. Returns subscriptions
          that include a plan belonging to any of the specified product IDs.
        style: form
        explode: false
      - name: plans
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Accepts a comma-separated list of plan IDs. Returns subscriptions
          that include any of the specified plan IDs.
        style: form
        explode: false
      - name: priceId
        in: query
        required: false
        schema:
          type: string
        description: Returns subscriptions that include a subscription plan line item
          linked to this price ID.
      - name: stripePriceId
        in: query
        required: false
        schema:
          type: string
        description: Returns subscriptions that include a subscription plan line item
          with this Stripe price ID.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Accepts a comma-separated list of statuses (eg `active,canceled`).
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Sort results by a field and direction. Format: `field:direction`
          (eg `createdAt:asc`).'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search across subscription IDs, Stripe subscription IDs, owner
          values, plan IDs, plan names, product IDs, product names, price IDs, and
          Stripe price IDs.
      - name: expand
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - owner
            - subscriptionPlans
        description: 'Expand related resources inline. Accepts a comma-separated list.
          Supported values: `owner`, `subscriptionPlans`.'
        style: form
        explode: false
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: Return records before this cursor for backwards pagination. Use
          the `previousCursor` from a previous response.
      - name: after
        in: query
        required: false
        schema:
          type: string
        description: Return records after this cursor for forward pagination. Use
          the `nextCursor` from a previous response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: The number of records returned in a response. Value between 1
          and 100. Defaults to 25.
      responses:
        '200':
          description: Successfully retrieved subscriptions
          content:
            application/json:
