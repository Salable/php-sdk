name: Release SDK

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  test:
    name: Test PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check formatting
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Test
        run: vendor/bin/phpunit

  drift:
    name: Generated client matches pinned spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-kiota@v0.5.0
        with:
          version: v1.35.0

      - name: Regenerate and fail on drift
        run: |
          ./scripts/generate.sh
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  release:
    name: Release
    needs: [test, drift]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install semantic-release
        run: npm ci

      - uses: shivammathur/setup-php@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - uses: microsoft/setup-kiota@v0.5.0
        if: github.event_name == 'workflow_dispatch'
        with:
          version: v1.35.0

      - name: Fetch OpenAPI spec
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -fsSL --fail \
            https://salable.app/openapi.yaml \
            -o openapi.yaml
          SOURCE=openapi.yaml ruby scripts/prepare-openapi.rb

      - name: Generate SDK with Kiota
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/generate.sh

      - name: Test generated client
        if: github.event_name == 'workflow_dispatch'
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          vendor/bin/php-cs-fixer fix --dry-run --diff
          vendor/bin/phpstan analyse --no-progress
          vendor/bin/phpunit

      - name: Commit for semantic release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A openapi.yaml src/SDK
          git commit --allow-empty -m "fix: openapi spec updated"

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
