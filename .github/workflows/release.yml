name: Release SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
    steps:
      - uses: microsoft/setup-kiota@v0.5.0

      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      - name: Fetch OpenAPI spec
        run: |
          curl -L --fail \
            https://salable.app/openapi.yaml \
            -o openapi.yaml

      - name: Generate SDK with Kiota
        run: |
          kiota generate --openapi ./openapi.yaml -o ./src/SDK --language php --class-name Salable --clean-output --namespace-name Salable\\SDK

      - name: Commit for semantic release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "fix: openapi spec updated"

      - name: Release
        id: release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
